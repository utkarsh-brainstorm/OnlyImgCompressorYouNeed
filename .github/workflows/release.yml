name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for the release (e.g. v1.0.2)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: OnlyImgCompressorYouNeed-linux-x86_64
            platform: linux
          - os: windows-latest
            artifact: OnlyImgCompressorYouNeed-windows-x86_64.exe
            platform: windows
          - os: macos-15-intel
            artifact: OnlyImgCompressorYouNeed-macos-x86_64
            platform: macos
          - os: macos-14
            artifact: OnlyImgCompressorYouNeed-macos-arm64
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same light native-webview deps as Querii / AttendanceProcessor
      - name: Install Linux WebKit2GTK (system webview)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            gobject-introspection \
            gcc \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-gi-cairo
          sudo apt-get install -y gir1.2-webkit2-4.1 \
            || sudo apt-get install -y gir1.2-webkit2-4.0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Confirm GTK/WebKit import path works on the build runner
          if [ "${{ matrix.platform }}" = "linux" ]; then
            python -c "import gi; gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2; print('webkit ok', WebKit2)"
          fi

      - name: Build with PyInstaller (onefile, OS webview)
        run: pyinstaller --noconfirm OnlyImgCompressorYouNeed.spec

      - name: Stage release binary (no zip)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/out
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "dist/OnlyImgCompressorYouNeed.exe" "dist/out/${{ matrix.artifact }}"
          else
            cp "dist/OnlyImgCompressorYouNeed" "dist/out/${{ matrix.artifact }}"
            chmod +x "dist/out/${{ matrix.artifact }}"
          fi
          ls -lh "dist/out/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/out/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten binaries
        run: |
          mkdir -p upload
          find release-assets -type f -exec cp {} upload/ \;
          chmod +x upload/* || true
          ls -lah upload

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OnlyImgCompressorYouNeed ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
