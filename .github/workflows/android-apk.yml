name: Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            android/.buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec', 'android/requirements.txt') }}
          restore-keys: buildozer-

      - name: Build APK with Buildozer
        uses: kivy/buildozer-action@v1
        id: build
        with:
          workdir: android
          buildozer_version: master

      - name: Collect APK
        run: |
          mkdir -p ../apk-out
          find bin -name '*.apk' -exec cp {} ../apk-out/ \;
          ls -la ../apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnlyImgCompressorYouNeed-android
          path: apk-out/*.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
